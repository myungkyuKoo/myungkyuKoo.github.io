---
layout: default
---
<div class="docs-section">

  {% if page.subtitle == "" or page.subtitle == nil %}
  	<h2 class="page-title">{{ page.title }}</h2>
  {% else %}
    <div class="title-subtitle">
      <h2 class="page-title">{{ page.title }}</h2>
      <p class="page-subtitle">{{ page.subtitle }}</p>
    </div>
  {% endif %}

  {{ content }}

</div>
